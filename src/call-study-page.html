<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>통화 영어 복습</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#2b2a28; --sub:#77736b; --line:#e7e2d8;
  --accent:#4a6fa5; --accent-soft:#e6eef8; --char:#3d4a3f; --char-soft:#eaf0e8;
  --good:#3c8d5a; --good-soft:#e3f3e8; --mid:#b98a1d; --mid-soft:#fbf1d8; --low:#b0567a; --low-soft:#f9e6ee;
  --teacher:#fff8e6; --teacher-line:#f0dfb0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 80px}
header{padding:8px 0 4px}
.date{color:var(--sub);font-size:13px}
h1{font-size:22px;margin:4px 0 2px}
.who{display:flex;align-items:center;gap:10px;margin-top:10px}
.ava{width:40px;height:40px;border-radius:50%;background:#2f3a33;color:#fff;display:grid;place-items:center;font-size:20px}
.demo{background:#eef3fb;border:1px dashed #aac0e0;color:#3b5578;border-radius:10px;padding:10px 12px;font-size:13px;margin:14px 0}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:9px;font:inherit;font-size:14px;color:var(--sub);cursor:pointer}
nav button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
section{display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px}
.num{font-size:12px;color:var(--sub)}
.ko{font-size:15px;margin:2px 0 8px}
.guess{display:inline-block;font-size:11.5px;background:#f1efe9;color:var(--sub);border-radius:6px;padding:1px 7px;margin-left:4px}
.en{font-family:Poppins,"Noto Sans KR",sans-serif;font-size:19px;font-weight:600;color:var(--accent);margin:0 0 8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.b{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.b:hover{background:#faf8f3}
.b.play{background:var(--accent-soft);border-color:#c9d8ee;color:#2c4d7c}
.b.cplay{background:var(--char-soft);border-color:#cdd9c9;color:var(--char)}
.b.big{padding:11px 20px;font-size:15px;font-weight:700;background:var(--accent);color:#fff;border-color:var(--accent)}
.b:disabled{opacity:.45;cursor:default}
.teacher{background:var(--teacher);border:1px solid var(--teacher-line);border-radius:10px;padding:10px 12px;font-size:14px}
.teacher b{color:#8a6412}
.teacher .t-h{font-size:12px;color:#9a7a33;margin-bottom:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12.5px;background:#fff;border:1px solid var(--teacher-line);border-radius:8px;padding:3px 8px}
.chip i{font-style:normal;color:var(--sub)}
.reply{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:14px}
.reply .gen{font-family:Poppins,"Noto Sans KR",sans-serif;color:var(--char);font-weight:500}
.reply .gko{color:var(--sub);font-size:13px}
.skipped{font-size:13px;color:var(--sub);background:#f1efe9;border-radius:10px;padding:10px 12px}
/* 역할극 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center}
.bubble{border-radius:14px;padding:12px 14px;margin:10px auto;max-width:520px;text-align:left}
.bubble.g{background:var(--char-soft)}
.bubble.me{background:var(--accent-soft)}
.bubble .lbl{font-size:12px;color:var(--sub)}
.bubble .t{font-family:Poppins,"Noto Sans KR",sans-serif;font-size:17px}
.bubble .k{font-size:13px;color:var(--sub)}
.hide-en .bubble.me .t{filter:blur(6px);transition:filter .2s}
.hide-en .bubble.me:hover .t{filter:none}
.mic{margin:14px auto 6px;width:84px;height:84px;border-radius:50%;background:#dfe6ef;display:grid;place-items:center;font-size:34px;transition:transform .08s}
.mic.listen{background:#cfe0f5}
.mic.talk{background:#a9c8ef}
.status{font-size:14px;color:var(--sub);min-height:22px}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
label.tog{font-size:13px;color:var(--sub);display:inline-flex;gap:6px;align-items:center;cursor:pointer}
/* 발음 체크 */
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.score{display:inline-block;min-width:54px;text-align:center;border-radius:8px;padding:2px 8px;font-weight:700;font-size:14px}
.s-good{background:var(--good-soft);color:var(--good)}
.s-mid{background:var(--mid-soft);color:var(--mid)}
.s-low{background:var(--low-soft);color:var(--low)}
.s-none{background:#f1efe9;color:var(--sub)}
.w{display:inline-block;padding:0 2px;border-radius:4px;margin:1px 0}
.w.miss{background:var(--low-soft);text-decoration:underline wavy #d49ab3;text-underline-offset:4px}
.heard{font-size:13px;color:var(--sub);margin-top:4px}
.empty{color:var(--sub);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="date" id="when"></div>
    <h1 id="ttl">📞 통화, 영어로 복습해요</h1>
    <div class="who"><div class="ava">💀</div><div><b id="cname"></b><div class="date">통화가 끝나면 자동으로 여기 쌓여요</div></div></div>
  </header>

  <div class="demo" id="demo" style="display:none"></div>
  <div class="date" style="margin:8px 0 0"><a href="../../">← 지난 통화 목록</a></div>

  <nav>
    <button data-tab="learn" class="on">① 표현 배우기</button>
    <button data-tab="play">② 다시 통화하기</button>
    <button data-tab="check">③ 발음 체크</button>
  </nav>

  <section id="learn" class="on"></section>

  <section id="play">
    <div class="stage" id="stage">
      <div style="font-size:15px;margin-bottom:6px">이번엔 <b>영어로</b> <span class="nm"></span>랑 다시 통화해요.</div>
      <div class="date"><span class="nm"></span>가 먼저 말하면, 내 차례에 영어 문장을 말해요.<br>말이 끝나면 <span class="nm"></span>가 바로 이어서 대답해요.</div>
      <div class="row" style="margin-top:14px">
        <label class="tog"><input type="checkbox" id="hideEn"> 영어 문장 가리기 (누르면 보여요)</label>
      </div>
      <div class="row"><button class="b big" id="startBtn">📞 통화 시작</button></div>
    </div>
  </section>

  <section id="check"><div class="empty">② 다시 통화하기를 끝내면 여기에 발음 결과가 나와요.</div></section>
</div>
